# Supabase's free plan pauses a project after about a week without requests, which silently
# breaks the RSVP form and the guestbook. This pings the database every 2 days to keep it awake.
# The publishable key is the same public key shipped in the site's JavaScript (read-only, RLS-guarded).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://wppyxhawmwhhmxsddgkz.supabase.co
          SUPABASE_KEY: sb_publishable_s4-fyvsvXtF3c4R8W8KYxA_ZIUlbAGL
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/guestbook_messages?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
